<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">修剪与过滤：剪短，还在；丢弃，才减少条数</title><desc id="desc">两条简化 read 展示处理动作。剪去接头后仍可保留 read，整条不符合规则才丢弃。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">剪掉一截，与丢弃整条，是两件事</text><rect x="55" y="95" width="227" height="44" rx="4" fill="#c9dfc5" stroke="#54867b"/><rect x="282" y="95" width="102" height="44" rx="4" fill="#edd0b4" stroke="#c17c50"/><text x="168" y="123" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">待测序列</text><text x="333" y="123" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">接头</text><rect x="55" y="231" width="227" height="44" rx="4" fill="#c9dfc5" stroke="#54867b"/><rect x="282" y="231" width="102" height="44" rx="4" fill="#edd0b4" stroke="#c17c50"/><text x="168" y="259" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">待测序列</text><text x="333" y="259" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">接头</text><circle cx="417" cy="96" r="7" fill="none" stroke="#c17c50" stroke-width="2"/><circle cx="417" cy="118" r="7" fill="none" stroke="#c17c50" stroke-width="2"/><path d="M423,99 L455,124" fill="none" stroke="#c17c50" stroke-width="3" stroke-dasharray=""/><path d="M423,116 L455,91" fill="none" stroke="#c17c50" stroke-width="3" stroke-dasharray=""/><path d="M464,111 L530,111" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M530,111 L522.3272793014645,115.70418506037593" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M530,111 L522.3272793014645,106.29581493962407" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><rect x="557" y="95" width="235" height="44" rx="4" fill="#c9dfc5" stroke="#54867b"/><text x="674" y="123" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">修剪后仍保留</text><text x="557" y="170" fill="#54867b" font-size="17" text-anchor="start" font-weight="400">read 条数不变，碱基总数减少</text><path d="M70,234 L267,285" fill="none" stroke="#b65f58" stroke-width="3" stroke-dasharray=""/><path d="M70,282 L267,235" fill="none" stroke="#b65f58" stroke-width="3" stroke-dasharray=""/><text x="65" y="319" fill="#b65f58" font-size="17" text-anchor="start" font-weight="400">例：主体序列质量不满足规则</text><path d="M420,251 L530,251" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M530,251 L522.3272793014645,255.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M530,251 L522.3272793014645,246.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><rect x="581" y="218" width="68" height="64" rx="4" fill="#eadbd5" stroke="#b65f58"/><path d="M572,214 L658,214" fill="none" stroke="#b65f58" stroke-width="4" stroke-dasharray=""/><path d="M597,228 L597,270" fill="none" stroke="#b65f58" stroke-width="2" stroke-dasharray=""/><path d="M633,228 L633,270" fill="none" stroke="#b65f58" stroke-width="2" stroke-dasharray=""/><text x="680" y="250" fill="#b65f58" font-size="18" text-anchor="start" font-weight="400">丢弃整条</text><text x="555" y="318" fill="#b65f58" font-size="17" text-anchor="start" font-weight="400">read 条数与碱基总数都减少</text><rect x="30" y="365" width="840" height="49" rx="10" fill="#e6eee0" stroke="none"/><text x="450" y="396" fill="#254c52" font-size="19" text-anchor="middle" font-weight="400">所以：reads 保留很多，仍可能已经剪掉不少接头碱基。</text></g></svg>
