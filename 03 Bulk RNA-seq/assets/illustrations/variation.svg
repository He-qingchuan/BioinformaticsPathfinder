<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">同样均值差，不同组内波动</title><desc id="desc">两幅示意散点图有相同组均值差，右图重复之间更分散。未在示意数据上计算统计 P 值。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">不只问差多少，还要看重复有多稳</text><rect x="35" y="65" width="378" height="294" rx="10" fill="#edf3e8" stroke="none"/><text x="224" y="99" fill="#254c52" font-size="20" text-anchor="middle" font-weight="600">组内较集中</text><path d="M89,301 L376,301" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M89,301 L89,122" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="78" y="306" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">0</text><text x="78" y="251" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">5</text><text x="78" y="196" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">10</text><text x="78" y="141" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">15</text><circle cx="156" cy="248.2" r="7" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="168" cy="246" r="7" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="180" cy="243.8" r="7" fill="#54867b" stroke="none" stroke-width="2"/><path d="M141,246.0 L195,246.0" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><text x="168" y="333" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">组 A</text><circle cx="289" cy="204.2" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="301" cy="202" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="313" cy="199.8" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><path d="M274,202.0 L328,202.0" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><text x="301" y="333" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">组 B</text><text x="378" y="126" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">示意表达值</text><rect x="483" y="65" width="378" height="294" rx="10" fill="#edf3e8" stroke="none"/><text x="672" y="99" fill="#254c52" font-size="20" text-anchor="middle" font-weight="600">组内较分散</text><path d="M537,301 L824,301" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M537,301 L537,122" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="526" y="306" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">0</text><text x="526" y="251" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">5</text><text x="526" y="196" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">10</text><text x="526" y="141" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">15</text><circle cx="604" cy="290" r="7" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="616" cy="246" r="7" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="628" cy="202" r="7" fill="#54867b" stroke="none" stroke-width="2"/><path d="M589,246.0 L643,246.0" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><text x="616" y="333" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">组 A</text><circle cx="737" cy="246" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="749" cy="202" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="761" cy="158" r="7" fill="#c17c50" stroke="none" stroke-width="2"/><path d="M722,202.0 L776,202.0" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><text x="749" y="333" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">组 B</text><text x="826" y="126" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">示意表达值</text><text x="450" y="391" fill="#254c52" font-size="19" text-anchor="middle" font-weight="600">两边都是：组 A 均值 5，组 B 均值 9；均值差同为 4。</text><text x="450" y="424" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">点是生物学重复，短黑线是组均值；统计判断还需要模型，不能只比较均值。</text></g></svg>
