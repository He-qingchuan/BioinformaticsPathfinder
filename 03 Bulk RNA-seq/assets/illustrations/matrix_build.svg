<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">把转录本归到基因，再把样本排成列</title><desc id="desc">简化计数示意。一个基因的两个转录本先按明确映射汇总，之后形成基因乘样本矩阵。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">矩阵的一格，是“这个基因 × 这份样本”</text><text x="40" y="90" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">样本 A 的转录本计数</text><text x="40" y="126" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">G1 · 转录本 a</text><rect x="198" y="108" width="17" height="22" rx="3" fill="#54867b" stroke="none"/><rect x="221" y="108" width="17" height="22" rx="3" fill="#54867b" stroke="none"/><rect x="244" y="108" width="17" height="22" rx="3" fill="#54867b" stroke="none"/><text x="40" y="186" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">G1 · 转录本 b</text><rect x="198" y="168" width="17" height="22" rx="3" fill="#54867b" stroke="none"/><rect x="221" y="168" width="17" height="22" rx="3" fill="#54867b" stroke="none"/><text x="40" y="246" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">G2 · 转录本 a</text><rect x="198" y="228" width="17" height="22" rx="3" fill="#397f9d" stroke="none"/><rect x="221" y="228" width="17" height="22" rx="3" fill="#397f9d" stroke="none"/><rect x="244" y="228" width="17" height="22" rx="3" fill="#397f9d" stroke="none"/><rect x="267" y="228" width="17" height="22" rx="3" fill="#397f9d" stroke="none"/><path d="M320 112h15v61h-15" fill="none" stroke="#54867b" stroke-width="2"/><path d="M346,143 L425,143" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M425,143 L417.32727930146444,147.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M425,143 L417.32727930146444,138.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="368" y="126" fill="#54867b" font-size="16" text-anchor="start" font-weight="400">3+2</text><path d="M325,241 L425,241" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><path d="M425,241 L417.32727930146444,245.70418506037592" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><path d="M425,241 L417.32727930146444,236.29581493962408" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><text x="530" y="98" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">样本 A</text><text x="678" y="98" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">样本 B</text><text x="431" y="162" fill="#254c52" font-size="20" text-anchor="start" font-weight="400">G1</text><rect x="478" y="122" width="106" height="63" rx="5" fill="#dbeada" stroke="#254c52"/><text x="531" y="163" fill="#254c52" font-size="26" text-anchor="middle" font-weight="600">5</text><rect x="625" y="122" width="106" height="63" rx="5" fill="#dbeada" stroke="#254c52"/><text x="678" y="163" fill="#254c52" font-size="26" text-anchor="middle" font-weight="600">10</text><text x="431" y="249" fill="#254c52" font-size="20" text-anchor="start" font-weight="400">G2</text><rect x="478" y="209" width="106" height="63" rx="5" fill="#dce9ed" stroke="#254c52"/><text x="531" y="250" fill="#254c52" font-size="26" text-anchor="middle" font-weight="600">4</text><rect x="625" y="209" width="106" height="63" rx="5" fill="#dce9ed" stroke="#254c52"/><text x="678" y="250" fill="#254c52" font-size="26" text-anchor="middle" font-weight="600">1</text><rect x="30" y="331" width="840" height="75" rx="10" fill="#e9efe2" stroke="none"/><text x="54" y="361" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">先核对转录本—基因对应关系，再对齐样本列名。</text><text x="54" y="388" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">图中数值为教学示意；真实 Salmon estimated counts 可以包含小数。</text></g></svg>
