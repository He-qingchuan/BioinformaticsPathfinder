<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">富集先问：候选中的比例比背景高吗</title><desc id="desc">教学集合含 20 个背景基因，其中 4 个属于橙色功能。圈出的 5 个候选中有 3 个属于该功能。候选是背景的子集。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="39" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">只看到“有 3 个”不够，还要知道它们从哪里来</text><rect x="30" y="74" width="402" height="272" rx="10" fill="#e7f0e1" stroke="none"/><text x="50" y="107" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">背景：20 个可注释基因</text><circle cx="83" cy="143" r="14" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="83" cy="143" r="21" fill="none" stroke="#254c52" stroke-width="2"/><circle cx="147" cy="143" r="14" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="147" cy="143" r="21" fill="none" stroke="#254c52" stroke-width="2"/><circle cx="211" cy="143" r="14" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="211" cy="143" r="21" fill="none" stroke="#254c52" stroke-width="2"/><circle cx="275" cy="143" r="14" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="339" cy="143" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="339" cy="143" r="21" fill="none" stroke="#254c52" stroke-width="2"/><circle cx="83" cy="192" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="83" cy="192" r="21" fill="none" stroke="#254c52" stroke-width="2"/><circle cx="147" cy="192" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="211" cy="192" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="275" cy="192" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="339" cy="192" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="83" cy="241" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="147" cy="241" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="211" cy="241" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="275" cy="241" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="339" cy="241" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="83" cy="290" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="147" cy="290" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="211" cy="290" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="275" cy="290" r="14" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="339" cy="290" r="14" fill="#54867b" stroke="none" stroke-width="2"/><text x="52" y="328" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">橙色功能：4 / 20 = 20%</text><path d="M447,204 L502,204" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M502,204 L494.32727930146444,208.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M502,204 L494.32727930146444,199.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><rect x="526" y="74" width="344" height="272" rx="10" fill="#f0e6d3" stroke="none"/><text x="549" y="107" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">候选：圈出的 5 个基因</text><circle cx="565" cy="183" r="17" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="625" cy="183" r="17" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="685" cy="183" r="17" fill="#c17c50" stroke="none" stroke-width="2"/><circle cx="745" cy="183" r="17" fill="#54867b" stroke="none" stroke-width="2"/><circle cx="805" cy="183" r="17" fill="#54867b" stroke="none" stroke-width="2"/><text x="546" y="262" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">橙色功能：3 / 5 = 60%</text><text x="546" y="310" fill="#c17c50" font-size="18" text-anchor="start" font-weight="400">候选比例是背景的 3 倍</text><text x="450" y="389" fill="#254c52" font-size="19" text-anchor="middle" font-weight="400">这里比较的是功能成员比例，不是两个组的表达倍数。</text><text x="450" y="424" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">20 个圆点与数值都是教学示意；正式 ORA 还需统计检验与多重校正。</text></g></svg>
