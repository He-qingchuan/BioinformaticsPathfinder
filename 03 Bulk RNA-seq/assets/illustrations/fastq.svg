<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">FASTQ：一条 read 的四行记录</title><desc id="desc">教学示意使用 Phred+33 编码；每个碱基对应一个质量字符。</desc><rect width="900" height="420" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="38" fill="#254c52" font-size="22" text-anchor="start" font-weight="600">同一条 read，有“读到了什么”和“有多确定”两条信息</text><text x="35" y="91" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">① 名称</text><rect x="215" y="62" width="355" height="43" rx="5" fill="#eef3e9" stroke="none"/><text x="237" y="91" font-family="monospace" font-size="26" letter-spacing="4" fill="#254c52">@toy_read_001</text><text x="35" y="146" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">② 碱基序列</text><rect x="215" y="117" width="355" height="43" rx="5" fill="#e5eee2" stroke="none"/><text x="237" y="146" font-family="monospace" font-size="26" letter-spacing="4" fill="#254c52">ACGTACGT</text><text x="35" y="201" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">③ 分隔行</text><rect x="215" y="172" width="355" height="43" rx="5" fill="#eef3e9" stroke="none"/><text x="237" y="201" font-family="monospace" font-size="26" letter-spacing="4" fill="#254c52">+</text><text x="35" y="256" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">④ 质量字符</text><rect x="215" y="227" width="355" height="43" rx="5" fill="#e5eee2" stroke="none"/><text x="237" y="256" font-family="monospace" font-size="26" letter-spacing="4" fill="#254c52">IIII?555</text><text x="617" y="130" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">8 个碱基</text><text x="617" y="157" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">↕ 一一对应</text><text x="617" y="184" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">8 个质量字符</text><path d="M30,309 L870,309" fill="none" stroke="#c9d9c6" stroke-width="1" stroke-dasharray=""/><text x="36" y="349" fill="#254c52" font-size="18" text-anchor="start" font-weight="600">本图的质量字符示意：</text><rect x="305" y="323" width="145" height="46" rx="10" fill="#dce9e0" stroke="none"/><text x="377" y="352" fill="#254c52" font-size="21" text-anchor="middle" font-weight="400">I → Q40</text><rect x="480" y="323" width="145" height="46" rx="10" fill="#dce9e0" stroke="none"/><text x="552" y="352" fill="#254c52" font-size="21" text-anchor="middle" font-weight="400">? → Q30</text><rect x="655" y="323" width="145" height="46" rx="10" fill="#dce9e0" stroke="none"/><text x="727" y="352" fill="#254c52" font-size="21" text-anchor="middle" font-weight="400">5 → Q20</text><text x="450" y="398" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">字符先按正确编码解码，才得到质量值；这里不是本案例的一条真实 read。</text></g></svg>
