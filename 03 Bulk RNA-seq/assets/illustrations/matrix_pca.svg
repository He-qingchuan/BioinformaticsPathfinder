<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">PCA 的一个点来自样本的一整列表达</title><desc id="desc">左侧简化表达矩阵的三列分别代表三个样本。PCA 为每一列样本计算主成分坐标，右侧位置仅为示意。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">从“一整列基因表达”，到“一个样本点”</text><text x="42" y="93" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">简化表达矩阵</text><text x="158" y="126" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">A1</text><text x="223" y="126" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">A2</text><text x="288" y="126" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">B1</text><text x="58" y="163" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G1</text><rect x="134" y="142" width="47" height="23" rx="2" fill="#9bb89a" stroke="none"/><rect x="199" y="142" width="47" height="23" rx="2" fill="#a1bb9d" stroke="none"/><rect x="264" y="142" width="47" height="23" rx="2" fill="#afc6a1" stroke="none"/><text x="58" y="191" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G2</text><rect x="134" y="170" width="47" height="23" rx="2" fill="#afc6a1" stroke="none"/><rect x="199" y="170" width="47" height="23" rx="2" fill="#b0c7a5" stroke="none"/><rect x="264" y="170" width="47" height="23" rx="2" fill="#b4d2d9" stroke="none"/><text x="58" y="219" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G3</text><rect x="134" y="198" width="47" height="23" rx="2" fill="#b4d2d9" stroke="none"/><rect x="199" y="198" width="47" height="23" rx="2" fill="#bdd4d8" stroke="none"/><rect x="264" y="198" width="47" height="23" rx="2" fill="#9bb89a" stroke="none"/><text x="58" y="247" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G4</text><rect x="134" y="226" width="47" height="23" rx="2" fill="#9bb89a" stroke="none"/><rect x="199" y="226" width="47" height="23" rx="2" fill="#a1bb9d" stroke="none"/><rect x="264" y="226" width="47" height="23" rx="2" fill="#afc6a1" stroke="none"/><text x="58" y="275" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G5</text><rect x="134" y="254" width="47" height="23" rx="2" fill="#afc6a1" stroke="none"/><rect x="199" y="254" width="47" height="23" rx="2" fill="#b0c7a5" stroke="none"/><rect x="264" y="254" width="47" height="23" rx="2" fill="#b4d2d9" stroke="none"/><text x="58" y="303" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">G6</text><rect x="134" y="282" width="47" height="23" rx="2" fill="#b4d2d9" stroke="none"/><rect x="199" y="282" width="47" height="23" rx="2" fill="#bdd4d8" stroke="none"/><rect x="264" y="282" width="47" height="23" rx="2" fill="#9bb89a" stroke="none"/><rect x="126" y="135" width="59" height="181" rx="5" fill="none" stroke="#54867b"/><text x="105" y="351" fill="#54867b" font-size="17" text-anchor="start" font-weight="400">框出的一列 = 一份样本</text><path d="M350,219 L465,219" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M465,219 L457.32727930146444,223.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M465,219 L457.32727930146444,214.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="352" y="169" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">按基因组合</text><text x="352" y="196" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">计算投影</text><path d="M524,322 L842,322" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M524,322 L524,110" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="832" y="351" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">PC1</text><text x="510" y="97" fill="#254c52" font-size="17" text-anchor="start" font-weight="400">PC2</text><circle cx="575" cy="254" r="12" fill="#54867b" stroke="none" stroke-width="2"/><text x="589" y="241" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">A1</text><circle cx="618" cy="228" r="12" fill="#54867b" stroke="none" stroke-width="2"/><text x="632" y="215" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">A2</text><circle cx="773" cy="151" r="12" fill="#397f9d" stroke="none" stroke-width="2"/><text x="787" y="138" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">B1</text><text x="450" y="405" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">一个点保留样本身份；坐标由许多基因共同决定，图中位置不是实测 PCA 得分。</text></g></svg>
