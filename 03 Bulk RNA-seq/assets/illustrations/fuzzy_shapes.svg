<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">表达量不同，也可能唱出相似的旋律</title><desc id="desc">教学基因 A 与 B 的原始量级不同，但变化形状一致。按基因标准化后形状重合，模糊隶属度是归属程度而非 P 值。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">先比较形状，再谈模块归属</text><text x="52" y="92" fill="#254c52" font-size="20" text-anchor="start" font-weight="600">原始量级不同</text><text x="375" y="92" fill="#254c52" font-size="20" text-anchor="start" font-weight="600">标准化后形状一致</text><text x="681" y="92" fill="#254c52" font-size="20" text-anchor="start" font-weight="600">允许模糊归属</text><path d="M50,306 L273,306" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M50,306 L50,125" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><polyline points="65.00,301.00 111.00,296.00 157.00,291.00 203.00,296.00 249.00,301.00" stroke="#54867b" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="260" y="295.0" fill="#54867b" font-size="18" text-anchor="start" font-weight="400">A</text><polyline points="65.00,256.00 111.00,206.00 157.00,156.00 203.00,206.00 249.00,256.00" stroke="#c17c50" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="260" y="250.0" fill="#c17c50" font-size="18" text-anchor="start" font-weight="400">B</text><text x="49" y="326" fill="#61796f" font-size="15" text-anchor="start" font-weight="400">示意时期 1 → 5</text><text x="41" y="145" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">60</text><text x="41" y="307" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">0</text><path d="M290,215 L332,215" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M332,215 L324.32727930146444,219.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M332,215 L324.32727930146444,210.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M363,252 L574,252" fill="none" stroke="#61796f" stroke-width="1" stroke-dasharray="4 4"/><path d="M363,314 L363,132" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><polyline points="373.00,304.59 418.00,238.85 463.00,173.11 508.00,238.85 553.00,304.59" stroke="#54867b" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="373.00,304.59 418.00,238.85 463.00,173.11 508.00,238.85 553.00,304.59" stroke="#c17c50" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="355" y="257" fill="#61796f" font-size="13" text-anchor="end" font-weight="400">0</text><text x="362" y="341" fill="#61796f" font-size="15" text-anchor="start" font-weight="400">同一行减均值、除标准差</text><path d="M595,215 L643,215" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M643,215 L635.3272793014645,219.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M643,215 L635.3272793014645,210.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><rect x="672" y="142" width="178" height="66" rx="10" fill="#dce9dd" stroke="none"/><text x="761" y="168" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">另一个示意基因 C</text><text x="761" y="193" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">有些像两种模式</text><rect x="672" y="237" width="107" height="35" rx="0" fill="#54867b" stroke="none"/><rect x="779" y="237" width="71" height="35" rx="0" fill="#c17c50" stroke="none"/><text x="721" y="261" fill="white" font-size="17" text-anchor="middle" font-weight="400">0.6</text><text x="814" y="261" fill="white" font-size="17" text-anchor="middle" font-weight="400">0.4</text><text x="672" y="310" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">模块 1 / 模块 2</text><text x="672" y="337" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">隶属度表示相符程度</text><text x="450" y="398" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">标准化让我们看相对形状；相似的表达轨迹并不自动等于同一生物通路。</text></g></svg>
