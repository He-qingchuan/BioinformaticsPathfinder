<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">decoy：给片段一个更完整的来源参照</title><desc id="desc">某片段与目标转录本局部相似，却与基因组其他位置更吻合；竞争比较有助减少错误归属。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="39" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">不要把“有点像”直接当成“来自它”</text><rect x="35" y="170" width="180" height="66" rx="10" fill="#e6d9b9" stroke="#c17c50"/><text x="125" y="210" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">待判断的片段</text><path d="M229,199 L335,112" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M335,112 L332.0535959090694,120.50404038871801" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M335,112 L326.0846591475162,113.23154272521646" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M229,210 L335,297" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M335,297 L326.0846591475162,295.76845727478354" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M335,297 L332.0535959090694,288.495959611282" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><rect x="358" y="78" width="305" height="101" rx="10" fill="#dfecda" stroke="none"/><text x="380" y="108" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">候选 A：目标转录本</text><rect x="382" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="406" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="430" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="454" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="478" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="502" y="129" width="17" height="18" rx="2" fill="#54867b" stroke="none"/><rect x="526" y="129" width="17" height="18" rx="2" fill="#e7ccb4" stroke="none"/><rect x="550" y="129" width="17" height="18" rx="2" fill="#e7ccb4" stroke="none"/><rect x="574" y="129" width="17" height="18" rx="2" fill="#e7ccb4" stroke="none"/><rect x="598" y="129" width="17" height="18" rx="2" fill="#e7ccb4" stroke="none"/><text x="697" y="127" fill="#61796f" font-size="18" text-anchor="start" font-weight="400">局部相似</text><rect x="358" y="245" width="305" height="101" rx="10" fill="#dcebed" stroke="none"/><text x="380" y="276" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">候选 B：基因组 decoy</text><rect x="382" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="406" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="430" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="454" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="478" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="502" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="526" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="550" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="574" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><rect x="598" y="296" width="17" height="18" rx="2" fill="#397f9d" stroke="none"/><text x="697" y="294" fill="#397f9d" font-size="18" text-anchor="start" font-weight="600">更吻合</text><text x="450" y="387" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">引入 decoy 竞争比较，帮助识别不宜强行计入目标 RNA 的片段。</text><text x="450" y="419" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">形状为示意；decoy 是参考序列，不是新样本，也不作为目标转录本报告丰度。</text></g></svg>
