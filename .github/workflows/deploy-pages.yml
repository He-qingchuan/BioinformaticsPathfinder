name: Deploy RNA-seq island course to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "04 Bulk RNA-seq/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare course site
        shell: bash
        run: |
          mkdir -p _site
          cp -a "04 Bulk RNA-seq/." _site/
          cp "_site/01_海岛探险教案.html" "_site/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
