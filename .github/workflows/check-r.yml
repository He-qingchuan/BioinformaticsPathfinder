name: Check R textbook
on:
  push:
    paths: ["02 R语言入门基础/**", ".github/workflows/check-r.yml"]
  pull_request:
    paths: ["02 R语言入门基础/**", ".github/workflows/check-r.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute-r:
    name: R 4.6.1 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 02 R语言入门基础
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install the four course packages
        shell: Rscript {0}
        run: |
          install.packages(c("dplyr", "tidyr", "stringr", "ggplot2"))
      - name: Execute every lesson in a fresh R session
        run: python qa/check_r.py
      - name: Verify data, statistics and failure cases
        run: python qa/check_semantics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-execution-${{ matrix.os }}
          path: 02 R语言入门基础/qa/artifacts/
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 02 R语言入门基础
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and browser tools
        run: |
          python -m pip install -r requirements.txt
          npm --prefix qa ci --ignore-scripts --no-audit --no-fund
          npx --prefix qa playwright install --with-deps chromium
      - name: Rebuild and validate independently
        run: |
          python tools/build.py
          python qa/validate.py
          node qa/browser.cjs
          python tools/package.py
      - name: Generated pages match committed sources
        run: git diff --exit-code -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-textbook-website
          path: |
            02 R语言入门基础/qa/artifacts/
            02 R语言入门基础/dist/
