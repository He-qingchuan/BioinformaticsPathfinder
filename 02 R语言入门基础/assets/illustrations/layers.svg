<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">把一幅图拆成可解释的层</title><desc id="desc">数据规定有哪些记录，映射决定位置，点图层决定画成点，标签和单位让图可以独立阅读。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">把一幅图拆成可解释的层</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><rect x="45" y="112" width="270" height="51" rx="9" fill="#dce9f0" stroke="none"/><text x="180.0" y="144.5" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">数据：有哪些点</text><rect x="45" y="179" width="270" height="51" rx="9" fill="#deeee6" stroke="none"/><text x="180.0" y="211.5" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">映射：点放在哪里</text><rect x="45" y="246" width="270" height="51" rx="9" fill="#f3e7c9" stroke="none"/><text x="180.0" y="278.5" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">图层：画成点</text><rect x="45" y="313" width="270" height="51" rx="9" fill="#e5dce9" stroke="none"/><text x="180.0" y="345.5" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">标签：名称与单位</text><path d="M335 245L425 245" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M505 329L837 329" fill="none" stroke="#173a50" stroke-width="2.5"/><path d="M505 329L505 120" fill="none" stroke="#173a50" stroke-width="2.5"/><circle cx="520" cy="150" r="7" fill="#256187"/><circle cx="568" cy="181" r="7" fill="#256187"/><circle cx="610" cy="190" r="7" fill="#256187"/><circle cx="668" cy="235" r="7" fill="#256187"/><circle cx="718" cy="221" r="7" fill="#256187"/><circle cx="780" cy="275" r="7" fill="#256187"/><text x="675" y="372" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">冠层覆盖（%）</text><text x="665" y="114" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">温度（°C）</text></g></svg>