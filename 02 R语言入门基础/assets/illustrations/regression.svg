<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">斜率带着单位</title><desc id="desc">直线的斜率是响应变化量除以解释变量变化量。图是概念示意，不代替实际样本的拟合结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">斜率带着单位</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><path d="M120 354L825 354" fill="none" stroke="#173a50" stroke-width="2.5"/><path d="M120 354L120 112" fill="none" stroke="#173a50" stroke-width="2.5"/><path d="M170 150L765 310" fill="none" stroke="#36866f" stroke-width="2.5"/><circle cx="220" cy="140" r="7" fill="#256187"/><circle cx="330" cy="217" r="7" fill="#256187"/><circle cx="430" cy="191" r="7" fill="#256187"/><circle cx="570" cy="296" r="7" fill="#256187"/><circle cx="680" cy="264" r="7" fill="#256187"/><path d="M330 193L590 193" fill="none" stroke="#b9553d" stroke-width="2.5"/><path d="M590 193L590 263" fill="none" stroke="#b9553d" stroke-width="2.5"/><text x="460" y="182" font-size="19" fill="#b9553d" text-anchor="middle" font-weight="400">Δx</text><text x="623" y="233" font-size="19" fill="#b9553d" text-anchor="middle" font-weight="400">Δy</text><text x="460" y="397" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">斜率 = Δy / Δx；解释时带上变量单位。</text></g></svg>