<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">文件都有自己的位置</title><desc id="desc">从 r-lab 项目根目录出发，用相对路径连接原始数据、脚本和输出。移动整个项目后内部路径仍成立。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">文件都有自己的位置</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><rect x="65" y="166" width="220" height="70" rx="9" fill="#c9dfe9" stroke="none"/><text x="175.0" y="208.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">r-lab / 项目根目录</text><path d="M285 201L373 136" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="385" y="113" width="235" height="51" rx="9" fill="#dce9f0" stroke="none"/><text x="502.5" y="145.5" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">data/</text><text x="720" y="145" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">原始记录</text><path d="M285 201L373 213" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="385" y="190" width="235" height="51" rx="9" fill="#dce9f0" stroke="none"/><text x="502.5" y="222.5" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">lessons/ 与 scripts/</text><text x="720" y="222" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">可执行步骤</text><path d="M285 201L373 290" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="385" y="267" width="235" height="51" rx="9" fill="#dce9f0" stroke="none"/><text x="502.5" y="299.5" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">results/</text><text x="720" y="299" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">图、表与简报</text><text x="460" y="374" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">data/sites.csv 从项目根目录出发；不用写用户名或电脑盘符。</text></g></svg>