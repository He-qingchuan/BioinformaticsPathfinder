<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">类别标签与内部编码</title><desc id="desc">10、20 是示例标签，1、2 是因子内部编码。先转回文字再转数字，才能恢复这些数值标签。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">类别标签与内部编码</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><text x="240" y="127" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">类别标签</text><text x="680" y="127" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">内部编码</text><rect x="145" y="149" width="190" height="48" rx="9" fill="#dce9f0" stroke="none"/><text x="240.0" y="180.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">&quot;10&quot;</text><path d="M345 173L575 173" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="590" y="149" width="180" height="48" rx="9" fill="#f1e0db" stroke="none"/><text x="680.0" y="180.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">1</text><rect x="145" y="211" width="190" height="48" rx="9" fill="#dce9f0" stroke="none"/><text x="240.0" y="242.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">&quot;20&quot;</text><path d="M345 235L575 235" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="590" y="211" width="180" height="48" rx="9" fill="#f1e0db" stroke="none"/><text x="680.0" y="242.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">2</text><rect x="145" y="273" width="190" height="48" rx="9" fill="#dce9f0" stroke="none"/><text x="240.0" y="304.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">&quot;10&quot;</text><path d="M345 297L575 297" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="590" y="273" width="180" height="48" rx="9" fill="#f1e0db" stroke="none"/><text x="680.0" y="304.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">1</text><text x="460" y="381" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">数字标签 → 先转字符 → 再转数值；不要把编码当测量值。</text></g></svg>