<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">让整理步骤接力</title><desc id="desc">每一站接收上一步结果，再交给下一站。示意中的管道顺序是选行、选列、排序；每步都可以停下来核对。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">让整理步骤接力</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><rect x="38" y="175" width="170" height="90" rx="9" fill="#dce9f0" stroke="none"/><text x="123.0" y="227.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">原始表</text><path d="M216 221L255 221" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="263" y="175" width="170" height="90" rx="9" fill="#dce9f0" stroke="none"/><text x="348.0" y="227.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">filter 选行</text><path d="M441 221L480 221" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="488" y="175" width="170" height="90" rx="9" fill="#dce9f0" stroke="none"/><text x="573.0" y="227.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">select 选列</text><path d="M666 221L705 221" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="713" y="175" width="170" height="90" rx="9" fill="#dce9f0" stroke="none"/><text x="798.0" y="227.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">arrange 排序</text><text x="460" y="335" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">每一步都返回一个结果；可先保存中间对象，核对后再连接。</text></g></svg>