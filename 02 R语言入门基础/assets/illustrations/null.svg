<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">在指定假设下看两侧极端</title><desc id="desc">示意以 30 为中心，均值 31.2 距它 1.2，因此双侧也计算不高于 28.8 的一端。实际概率由本节 R 代码计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">在指定假设下看两侧极端</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><path d="M90 326L838 326" fill="none" stroke="#173a50" stroke-width="2.5"/><path d="M100 325 C260 325 310 120 460 120 S665 325 820 325" fill="none" stroke="#256187" stroke-width="4"/><path d="M278 330L278 170" fill="none" stroke="#b9553d" stroke-width="2.5" stroke-dasharray="6 6"/><text x="278" y="363" font-size="20" fill="#b9553d" text-anchor="middle" font-weight="400">28.8</text><path d="M460 330L460 170" fill="none" stroke="#173a50" stroke-width="2.5" stroke-dasharray="6 6"/><text x="460" y="363" font-size="20" fill="#173a50" text-anchor="middle" font-weight="400">30</text><path d="M642 330L642 170" fill="none" stroke="#b9553d" stroke-width="2.5" stroke-dasharray="6 6"/><text x="642" y="363" font-size="20" fill="#b9553d" text-anchor="middle" font-weight="400">31.2</text><path d="M271 289L151 289" fill="none" stroke="#b9553d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M650 289L776 289" fill="none" stroke="#b9553d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="181" y="259" font-size="17" fill="#b9553d" text-anchor="middle" font-weight="400">更低的一端</text><text x="737" y="259" font-size="17" fill="#b9553d" text-anchor="middle" font-weight="400">更高的一端</text><text x="460" y="402" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">假定均值为 30 及模型成立；两边都算“至少同样远”。</text></g></svg>