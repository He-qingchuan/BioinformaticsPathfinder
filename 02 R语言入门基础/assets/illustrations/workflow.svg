<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">从输入到可追溯的结果</title><desc id="desc">观察表先检查再去掉完全重复，汇总时记录有效数；独立实验和横断面资料沿各自设计进行推断。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">从输入到可追溯的结果</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><rect x="35" y="126" width="215" height="58" rx="9" fill="#dce9f0" stroke="none"/><text x="142.5" y="162.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">观察表 43 行</text><path d="M260 155L307 155" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="126" width="280" height="58" rx="9" fill="#deeee6" stroke="none"/><text x="460.0" y="162.0" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">检查 → 去重 → 42 行</text><path d="M610 155L675 245" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="209" width="215" height="58" rx="9" fill="#dce9f0" stroke="none"/><text x="142.5" y="245.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">独立装置 48 个</text><path d="M260 238L307 238" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="209" width="280" height="58" rx="9" fill="#deeee6" stroke="none"/><text x="460.0" y="245.0" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">随机分组 → Welch 比较</text><path d="M610 238L675 245" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="292" width="215" height="58" rx="9" fill="#dce9f0" stroke="none"/><text x="142.5" y="328.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">独立地点 30 个</text><path d="M260 321L307 321" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="292" width="280" height="58" rx="9" fill="#deeee6" stroke="none"/><text x="460.0" y="328.0" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">横断面 → 回归与诊断</text><path d="M610 321L675 245" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="694" y="189" width="195" height="114" rx="9" fill="#dce9f0" stroke="none"/><text x="791.5" y="253.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">图表与分析简报</text><text x="460" y="405" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">分别保留设计与有效数，不能拼在一起扩大“样本量”。</text></g></svg>