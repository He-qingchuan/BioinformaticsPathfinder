<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">文本文件与 R 对象</title><desc id="desc">CSV 按格式约定读成表；写出 CSV 便于交换，RDS 保存单个 R 对象的结构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">文本文件与 R 对象</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><rect x="65" y="185" width="190" height="72" rx="9" fill="#dce9f0" stroke="none"/><text x="160.0" y="228.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">CSV 文本文件</text><rect x="365" y="185" width="190" height="72" rx="9" fill="#deeee6" stroke="none"/><text x="460.0" y="228.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">R 数据框</text><path d="M265 220L355 220" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="164" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">读取</text><path d="M565 220L662 157" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="675" y="130" width="200" height="60" rx="9" fill="#dce9f0" stroke="none"/><text x="775.0" y="167.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">CSV：交换表格</text><path d="M565 220L662 312" fill="none" stroke="#256187" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="675" y="285" width="200" height="60" rx="9" fill="#dce9f0" stroke="none"/><text x="775.0" y="322.0" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">RDS：保存对象</text><text x="460" y="390" font-size="19" fill="#173a50" text-anchor="middle" font-weight="400">检查表头、分隔符、编码、