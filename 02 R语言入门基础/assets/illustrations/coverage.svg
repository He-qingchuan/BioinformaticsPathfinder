<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">真值固定，区间在变</title><desc id="desc">竖线代表固定的总体真值；各横线来自不同样本。示意只画六次，不用于估计 95% 覆盖比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256187"/></marker></defs><rect width="920" height="440" rx="18" fill="#fbfdfe"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="38" y="50" font-size="27" fill="#173a50" text-anchor="start" font-weight="700">真值固定，区间在变</text><text x="38" y="82" font-size="13" fill="#256187" text-anchor="start" font-weight="400">数据调查小镇 / 概念图解</text><path d="M475 114L475 358" fill="none" stroke="#b9553d" stroke-width="2.5" stroke-dasharray="6 6"/><text x="475" y="104" font-size="18" fill="#b9553d" text-anchor="middle" font-weight="400">固定的真值</text><path d="M330 144L570 144" fill="none" stroke="#256187" stroke-width="2.5"/><circle cx="330" cy="144" r="3" fill="#256187"/><circle cx="570" cy="144" r="3" fill="#256187"/><text x="155" y="151" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 1</text><path d="M425 182L675 182" fill="none" stroke="#256187" stroke-width="2.5"/><circle cx="425" cy="182" r="3" fill="#256187"/><circle cx="675" cy="182" r="3" fill="#256187"/><text x="155" y="189" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 2</text><path d="M205 220L430 220" fill="none" stroke="#b9553d" stroke-width="2.5"/><circle cx="205" cy="220" r="3" fill="#b9553d"/><circle cx="430" cy="220" r="3" fill="#b9553d"/><text x="155" y="227" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 3</text><path d="M372 258L603 258" fill="none" stroke="#256187" stroke-width="2.5"/><circle cx="372" cy="258" r="3" fill="#256187"/><circle cx="603" cy="258" r="3" fill="#256187"/><text x="155" y="265" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 4</text><path d="M519 296L737 296" fill="none" stroke="#b9553d" stroke-width="2.5"/><circle cx="519" cy="296" r="3" fill="#b9553d"/><circle cx="737" cy="296" r="3" fill="#b9553d"/><text x="155" y="303" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 5</text><path d="M341 334L520 334" fill="none" stroke="#256187" stroke-width="2.5"/><circle cx="341" cy="334" r="3" fill="#256187"/><circle cx="520" cy="334" r="3" fill="#256187"/><text x="155" y="341" font-size="17" fill="#173a50" text-anchor="middle" font-weight="400">样本 6</text><text x="460" y="401" font-size="18" fill="#173a50" text-anchor="middle" font-weight="400">只画 6 次帮助理解；覆盖比例要靠大量重复抽样考察。</text></g></svg>