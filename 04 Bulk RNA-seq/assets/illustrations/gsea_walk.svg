<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">GSEA：沿队伍走，遇到成员就加分</title><desc id="desc">12 个基因按方向排队，其中 4 个橙色基因属于同一功能。采用等权示意：命中加 1/4，非命中减 1/8，结束回到零。</desc><rect width="900" height="490" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">同一个功能的成员，是否挤在队伍的一端？</text><text x="87" y="79" fill="#c17c50" font-size="17" text-anchor="start" font-weight="400">正向端</text><text x="730" y="79" fill="#397f9d" font-size="17" text-anchor="start" font-weight="400">负向端</text><rect x="116" y="96" width="38" height="38" rx="4" fill="#c17c50" stroke="none"/><text x="135" y="122" fill="white" font-size="16" text-anchor="middle" font-weight="400">1</text><path d="M135,144 L135,165" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><rect x="174" y="96" width="38" height="38" rx="4" fill="#c17c50" stroke="none"/><text x="193" y="122" fill="white" font-size="16" text-anchor="middle" font-weight="400">2</text><path d="M193,144 L193,165" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><rect x="232" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="251" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">3</text><rect x="290" y="96" width="38" height="38" rx="4" fill="#c17c50" stroke="none"/><text x="309" y="122" fill="white" font-size="16" text-anchor="middle" font-weight="400">4</text><path d="M309,144 L309,165" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><rect x="348" y="96" width="38" height="38" rx="4" fill="#c17c50" stroke="none"/><text x="367" y="122" fill="white" font-size="16" text-anchor="middle" font-weight="400">5</text><path d="M367,144 L367,165" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><rect x="406" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="425" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">6</text><rect x="464" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="483" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">7</text><rect x="522" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="541" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">8</text><rect x="580" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="599" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">9</text><rect x="638" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="657" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">10</text><rect x="696" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="715" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">11</text><rect x="754" y="96" width="38" height="38" rx="4" fill="#b5ced0" stroke="none"/><text x="773" y="122" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">12</text><text x="52" y="196" fill="#254c52" font-size="16" text-anchor="start" font-weight="400">累计分数</text><path d="M86,382 L850,382" fill="none" stroke="#61796f" stroke-width="1" stroke-dasharray="4 4"/><path d="M86,210 L86,395" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="73" y="387" fill="#61796f" font-size="14" text-anchor="end" font-weight="400">0</text><text x="73" y="305.0" fill="#61796f" font-size="14" text-anchor="end" font-weight="400">0.5</text><text x="73" y="223" fill="#61796f" font-size="14" text-anchor="end" font-weight="400">1</text><polyline points="106.00,382.00 135.00,341.00 193.00,300.00 251.00,320.50 309.00,279.50 367.00,238.50 425.00,259.00 483.00,279.50 541.00,300.00 599.00,320.50 657.00,341.00 715.00,361.50 773.00,382.00" stroke="#54867b" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="450" y="248" fill="#54867b" font-size="18" text-anchor="start" font-weight="600">前端命中密集，分数先明显上升</text><text x="450" y="436" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">这里采用等权示意：命中 +1/4，未命中 −1/8。</text><text x="450" y="471" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">真实 GSEA 还会考虑排序权重、标准化和统计检验；这些位置不是本案例的基因排名。</text></g></svg>
