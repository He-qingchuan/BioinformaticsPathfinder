5 L360.32727930146444,269.70418506037595" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><path d="M368,265 L360.32727930146444,260.29581493962405" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><text x="300" y="253" fill="#397f9d" font-size="16" text-anchor="start" font-weight="400">R1 →</text><path d="M545,334 L469,334" fill="none" stroke="#c17c50" stroke-width="2" stroke-dasharray=""/><path d="M469,334 L476.67272069853556,329.29581493962405" fill="none" stroke="#c17c50" stroke-width="2" stroke-dasharray=""/><path d="M469,334 L476.67272069853556,338.70418506037595" fill="none" stroke="#c17c50" stroke-width="2" stroke-dasharray=""/><text x="490" y="360" fill="#c17c50" font-size="16" text-anchor="start" font-weight="400">← R2</text><path d="M593,295 L660,295" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M660,295 L652.3272793014645,299.70418506037595" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M660,295 L652.3272793014645,290.29581493962405" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="690" y="285" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">R1.fastq</text><text x="690" y="312" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">R2.fastq</text><text x="450" y="411" fill="#254c52" font-size="20" text-anchor="middle" font-weight="600">21 个文库 × 每库 2 端 = 42 个 FASTQ 文件</text><text x="450" y="445" fill="#61796f" font-size="17" text-anchor="middle" font-weight="400">同一片段的两端提供配对信息，不能算作两个生物学重复。</text></g></svg>
