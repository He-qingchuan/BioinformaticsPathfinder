<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">把名单、韦恩图和 UpSet 对上</title><desc id="desc">两个教学集合 A={a,b} 与 B={b,c}。韦恩交集只有基因 b；UpSet 用深浅点表示同一成员关系。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">同一批成员，可以用不同方式排给你看</text><rect x="30" y="92" width="186" height="219" rx="10" fill="#e6eee0" stroke="none"/><text x="51" y="127" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">比较 A 的名单</text><text x="51" y="154" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">a    b</text><text x="51" y="181" fill="#254c52" font-size="18" text-anchor="start" font-weight="400"></text><text x="51" y="208" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">比较 B 的名单</text><text x="51" y="235" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">b    c</text><path d="M231,200 L285,200" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M285,200 L277.32727930146444,204.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M285,200 L277.32727930146444,195.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><circle cx="345" cy="199" r="66" fill="#c2d9c6" stroke="#54867b" stroke-width="2"/><circle cx="419" cy="199" r="66" fill="#d4e3e8" stroke="#397f9d" stroke-width="2"/><circle cx="345" cy="199" r="66" fill="none" stroke="#54867b" stroke-width="2"/><circle cx="419" cy="199" r="66" fill="none" stroke="#397f9d" stroke-width="2"/><text x="314" y="204" fill="#54867b" font-size="25" text-anchor="start" font-weight="400">a</text><text x="383" y="204" fill="#254c52" font-size="25" text-anchor="middle" font-weight="600">b</text><text x="447" y="204" fill="#397f9d" font-size="25" text-anchor="start" font-weight="400">c</text><text x="321" y="106" fill="#54867b" font-size="17" text-anchor="start" font-weight="400">集合 A</text><text x="424" y="106" fill="#397f9d" font-size="17" text-anchor="start" font-weight="400">集合 B</text><text x="382" y="305" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">重叠区：只有基因 b</text><path d="M505,200 L555,200" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M555,200 L547.3272793014645,204.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M555,200 L547.3272793014645,195.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="663" y="91" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">同一个交集，换成点阵</text><rect x="636" y="122" width="28" height="52" rx="0" fill="#397f9d" stroke="none"/><text x="650" y="112" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">1</text><text x="650" y="323" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">a</text><circle cx="650" cy="220" r="8" fill="#254c52" stroke="none" stroke-width="2"/><circle cx="650" cy="267" r="8" fill="#d9e3d8" stroke="none" stroke-width="2"/><rect x="708" y="122" width="28" height="52" rx="0" fill="#397f9d" stroke="none"/><text x="722" y="112" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">1</text><text x="722" y="323" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">b</text><path d="M722,220 L722,267" fill="none" stroke="#254c52" stroke-width="3" stroke-dasharray=""/><circle cx="722" cy="220" r="8" fill="#254c52" stroke="none" stroke-width="2"/><circle cx="722" cy="267" r="8" fill="#254c52" stroke="none" stroke-width="2"/><rect x="780" y="122" width="28" height="52" rx="0" fill="#397f9d" stroke="none"/><text x="794" y="112" fill="#254c52" font-size="17" text-anchor="middle" font-weight="400">1</text><text x="794" y="323" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">c</text><circle cx="794" cy="220" r="8" fill="#d9e3d8" stroke="none" stroke-width="2"/><circle cx="794" cy="267" r="8" fill="#254c52" stroke="none" stroke-width="2"/><text x="588" y="226" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">A</text><text x="588" y="273" fill="#254c52" font-size="18" text-anchor="start" font-weight="400">B</text><path d="M610,177 L841,177" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="677" y="360" fill="#397f9d" font-size="17" text-anchor="middle" font-weight="400">柱上数字 = 基因数</text><text x="450" y="412" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">中间一列：A、B 都为深色，表示同时入选两份名单的基因 b。</text></g></svg>
