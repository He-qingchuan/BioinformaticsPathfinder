<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">同一个基因，在三种结果里的位置</title><desc id="desc">假设基因 Gx 的 log2FC=2，padj=0.01；火山点落在 (2,2)。热图一行展开六个样本，统计值和颜色均为教学示意。</desc><rect width="900" height="470" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="22" text-anchor="start" font-weight="600">同一个基因：表里一行，火山图一个点，热图一整行</text><rect x="30" y="76" width="839" height="81" rx="10" fill="#e5eee0" stroke="none"/><text x="53" y="106" fill="#61796f" font-size="15" text-anchor="start" font-weight="400">教学假设 · 比较方向：B 相对 A</text><text x="53" y="140" fill="#254c52" font-size="22" text-anchor="start" font-weight="600">Gx</text><text x="168" y="138" fill="#254c52" font-size="22" text-anchor="start" font-weight="400">log₂FC = +2</text><text x="393" y="138" fill="#254c52" font-size="22" text-anchor="start" font-weight="400">padj = 0.01</text><text x="627" y="138" fill="#254c52" font-size="20" text-anchor="start" font-weight="400">−log₁₀(0.01) = 2</text><path d="M251,169 L251,202" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M251,202 L246.29581493962408,194.32727930146444" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M251,202 L255.70418506037592,194.32727930146444" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M654,169 L654,202" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M654,202 L649.295814939624,194.32727930146444" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M654,202 L658.704185060376,194.32727930146444" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M65,370 L395,370" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M219,370 L219,220" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><text x="57" y="217" fill="#254c52" font-size="15" text-anchor="start" font-weight="400">−log₁₀(padj)</text><text x="342" y="419" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">log₂FC</text><text x="91" y="390" fill="#254c52" font-size="14" text-anchor="middle" font-weight="400">−2</text><text x="219" y="390" fill="#254c52" font-size="14" text-anchor="middle" font-weight="400">0</text><text x="347" y="390" fill="#254c52" font-size="14" text-anchor="middle" font-weight="400">+2</text><circle cx="347" cy="264" r="11" fill="#c17c50" stroke="none" stroke-width="2"/><text x="321" y="248" fill="#c17c50" font-size="18" text-anchor="start" font-weight="600">Gx</text><path d="M219,264 L347,264" fill="none" stroke="#61796f" stroke-width="1" stroke-dasharray="4 4"/><text x="208" y="269" fill="#254c52" font-size="15" text-anchor="end" font-weight="400">2</text><text x="488" y="238" fill="#254c52" font-size="16" text-anchor="start" font-weight="400">组 A 的重复</text><text x="686" y="238" fill="#254c52" font-size="16" text-anchor="start" font-weight="400">组 B 的重复</text><rect x="484" y="262" width="51" height="56" rx="2" fill="#b5cedd" stroke="none"/><text x="509" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">1</text><rect x="541" y="262" width="51" height="56" rx="2" fill="#a3c1d5" stroke="none"/><text x="566" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">2</text><rect x="598" y="262" width="51" height="56" rx="2" fill="#c7d9df" stroke="none"/><text x="623" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">3</text><rect x="655" y="262" width="51" height="56" rx="2" fill="#deb78f" stroke="none"/><text x="680" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">1</text><rect x="712" y="262" width="51" height="56" rx="2" fill="#cf9c69" stroke="none"/><text x="737" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">2</text><rect x="769" y="262" width="51" height="56" rx="2" fill="#c18b54" stroke="none"/><text x="794" y="345" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">3</text><text x="445" y="296" fill="#254c52" font-size="18" text-anchor="start" font-weight="600">Gx</text><text x="641" y="387" fill="#254c52" font-size="16" text-anchor="middle" font-weight="400">一格 = 一份样本的行 Z-score</text><text x="450" y="445" fill="#61796f" font-size="16" text-anchor="middle" font-weight="400">图中为示意值：火山图概括组间检验，热图展开样本表达；两者不是独立实验。</text></g></svg>
