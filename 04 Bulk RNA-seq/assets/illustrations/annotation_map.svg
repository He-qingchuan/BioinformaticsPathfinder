<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">让自定义基因编号连上功能字典</title><desc id="desc">原理示意展示代表蛋白和同源证据形成的基因—功能多对多映射。没有证据的基因保留未知，不强行赋予功能。</desc><rect width="900" height="440" rx="16" fill="#f8fbf4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#254c52" font-size="23" text-anchor="start" font-weight="600">编号本身没有功能，注释要有证据作桥梁</text><text x="54" y="90" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">本物种基因</text><text x="302" y="90" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">对应代表蛋白</text><text x="633" y="90" fill="#254c52" font-size="19" text-anchor="start" font-weight="600">有证据支持的功能标签</text><rect x="44" y="112" width="151" height="45" rx="10" fill="#dfe9da" stroke="none"/><text x="119" y="142" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">Gene_A</text><path d="M207,135 L282,135" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,135 L274.32727930146444,139.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,135 L274.32727930146444,130.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><polyline points="305.00,135.00 321.00,146.97 337.00,136.69 353.00,123.27 369.00,131.65 385.00,146.26 401.00,139.95 417.00,124.44 433.00,128.56" stroke="#54867b" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="44" y="194" width="151" height="45" rx="10" fill="#dfe9da" stroke="none"/><text x="119" y="224" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">Gene_B</text><path d="M207,217 L282,217" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,217 L274.32727930146444,221.70418506037592" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,217 L274.32727930146444,212.29581493962408" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><polyline points="305.00,217.00 321.00,228.97 337.00,218.69 353.00,205.27 369.00,213.65 385.00,228.26 401.00,221.95 417.00,206.44 433.00,210.56" stroke="#397f9d" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="44" y="276" width="151" height="45" rx="10" fill="#dfe9da" stroke="none"/><text x="119" y="306" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">Gene_C</text><path d="M207,299 L282,299" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,299 L274.32727930146444,303.70418506037595" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><path d="M282,299 L274.32727930146444,294.29581493962405" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray=""/><polyline points="305.00,299.00 321.00,310.97 337.00,300.69 353.00,287.27 369.00,295.65 385.00,310.26 401.00,303.95 417.00,288.44 433.00,292.56" stroke="#61796f" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="465" y="254" fill="#254c52" font-size="16" text-anchor="start" font-weight="400">同源搜索</text><text x="465" y="281" fill="#254c52" font-size="16" text-anchor="start" font-weight="400">与注释转移</text><path d="M451,135 L632,134" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M632,134 L624.353385976284,138.74650334165167" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M632,134 L624.3014068241679,129.33827680862208" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M451,143 L632,224" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M632,224 L623.075030435015,225.1597061110865" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M632,224 L626.9181297997729,216.57203962934344" fill="none" stroke="#54867b" stroke-width="2" stroke-dasharray=""/><path d="M451,216 L632,224" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><path d="M632,224 L624.1270458423046,228.36080185640523" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><path d="M632,224 L624.5424798197101,218.9616081176065" fill="none" stroke="#397f9d" stroke-width="2" stroke-dasharray=""/><rect x="648" y="109" width="205" height="53" rx="10" fill="#e5ead4" stroke="none"/><text x="750" y="142" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">GO 功能 α</text><rect x="648" y="202" width="205" height="53" rx="10" fill="#dce9ec" stroke="none"/><text x="750" y="235" fill="#254c52" font-size="18" text-anchor="middle" font-weight="400">KEGG 功能 β</text><path d="M462,299 L618,299" fill="none" stroke="#61796f" stroke-width="2" stroke-dasharray="5 5"/><text x="660" y="307" fill="#61796f" font-size="18" text-anchor="start" font-weight="400">暂缺功能证据</text><text x="450" y="373" fill="#254c52" font-size="19" text-anchor="middle" font-weight="400">一个基因可以关联多个功能，一个功能也可以关联多个基因。</text><text x="450" y="412" fill="#61796f" font-size="17" text-anchor="middle" font-weight="400">图中名称为示意；实际映射以代表蛋白、数据库与筛选记录为依据。</text></g></svg>
