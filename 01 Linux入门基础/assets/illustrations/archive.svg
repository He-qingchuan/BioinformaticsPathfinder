<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">把文件装箱，再压缩</title><desc id="desc">tar 保存文件与目录层次，gzip 压缩归档。查看清单后在新目录解开，才能看清有没有多一层目录。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><path d="M35 121v-8q0-9 9-9h64.0l13 16h72.0q12 0 12 12v62q0 12-12 12H47q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="50" y="166" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">notes</text><path d="M218 166 L305 166" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="65" width="195" height="208" rx="7" fill="#f5e6c9" stroke="#a5c2bd" stroke-width="2"/><text x="428" y="124" font-size="34" fill="#163d43" text-anchor="middle" font-weight="700">TAR</text><text x="428" y="166" font-size="20" fill="#163d43" text-anchor="middle" font-weight="400">目录与文件</text><text x="428" y="210" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">完整装箱</text><path d="M540 166 L624 166" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="102" width="160" height="135" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="730" y="155" font-size="25" fill="#163d43" text-anchor="middle" font-weight="600">.tar.gz</text><text x="730" y="196" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">gzip 压缩</text><text x="425" y="329" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">t 查看清单  ·  x 解压  ·  在新目录核对内容</text></g></svg>