<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">复制与移动，留下的东西不同</title><desc id="desc">复制在目标处产生副本，原文件仍在；移动或改名改变原来的位置或名称。操作前看清已有目标是否会被覆盖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="30" y="65" width="168" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="44" y="93" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">原件</text><text x="44" y="118" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">morning.txt</text><path d="M215 120 L320 120" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="65" width="168" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="359" y="93" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">副本</text><text x="359" y="118" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">morning-copy.txt</text><text x="267" y="92" font-size="22" fill="#163d43" text-anchor="middle" font-weight="600">cp</text><text x="117" y="238" font-size="22" fill="#163d43" text-anchor="middle" font-weight="400">原件还在</text><path d="M534 120 L640 120" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M662 87v-8q0-9 9-9h64.0l13 16h72.0q12 0 12 12v62q0 12-12 12H674q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="677" y="132" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">backup</text><text x="587" y="92" font-size="22" fill="#163d43" text-anchor="middle" font-weight="600">mv</text><text x="670" y="260" font-size="20" fill="#163d43" text-anchor="start" font-weight="400">副本换了位置</text><text x="425" y="323" font-size="20" fill="#163d43" text-anchor="middle" font-weight="400">先认清源路径，再认清目标路径。</text></g></svg>