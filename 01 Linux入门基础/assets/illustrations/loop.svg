<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">每次拿一份，做相同的检查</title><desc id="desc">for 依次给变量赋一个路径；if 先检查，再执行动作。下一次循环换一个路径，动作仍然相同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="32" y="85" width="190" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="46" y="113" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">day-01.log</text><text x="46" y="138" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">day-02.log</text><path d="M238 147 L319 147" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="62" width="205" height="190" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="442" y="113" font-size="27" fill="#163d43" text-anchor="middle" font-weight="600">record</text><text x="442" y="158" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">检查是普通文件</text><text x="442" y="208" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">显示名字、数行</text><path d="M561 147 L620 147" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="85" width="185" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="654" y="113" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">day-01.log: 4</text><text x="654" y="138" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">day-02.log: 4</text><path d="M510 271Q423 350 325 271" stroke="#ad7143" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="425" y="344" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">换下一个路径，再做一次</text></g></svg>