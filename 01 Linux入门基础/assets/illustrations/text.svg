<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">从不同的窗口看同一份文本</title><desc id="desc">head 看开头，tail 看末尾，less 用于翻阅。wc -l 统计换行符；本例每行都有换行，得到 4。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="75" y="40" width="460" height="260" rx="14" fill="#fff" stroke="#a5c2bd" stroke-width="2"/><rect x="88" y="61" width="433" height="40" rx="4" fill="#dceef0" stroke="none" stroke-width="2"/><text x="105" y="87" font-size="19" fill="#163d43" text-anchor="start" font-weight="400">1  08:00 INFO start</text><rect x="88" y="115" width="433" height="40" rx="4" fill="#dceef0" stroke="none" stroke-width="2"/><text x="105" y="141" font-size="19" fill="#163d43" text-anchor="start" font-weight="400">2  08:05 INFO lake ready</text><rect x="88" y="169" width="433" height="40" rx="4" fill="#f5f8f5" stroke="none" stroke-width="2"/><text x="105" y="195" font-size="19" fill="#163d43" text-anchor="start" font-weight="400">3  08:10 WARN battery low</text><rect x="88" y="223" width="433" height="40" rx="4" fill="#f5e6c9" stroke="none" stroke-width="2"/><text x="105" y="249" font-size="19" fill="#163d43" text-anchor="start" font-weight="400">4  08:20 INFO saved</text><text x="585" y="101" font-size="23" fill="#163d43" text-anchor="start" font-weight="400">head -n 2</text><text x="585" y="241" font-size="23" fill="#163d43" text-anchor="start" font-weight="400">tail -n 1</text><text x="585" y="299" font-size="23" fill="#163d43" text-anchor="start" font-weight="400">wc -l → 4</text><text x="95" y="335" font-size="18" fill="#163d43" text-anchor="start" font-weight="400">less：按自己的速度翻阅；q 退出。</text></g></svg>