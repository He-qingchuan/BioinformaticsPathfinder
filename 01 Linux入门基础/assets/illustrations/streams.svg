<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">结果和诊断走不同通道</title><desc id="desc">标准输出编号为 1，标准错误为 2。重定向可以分别保存；普通管道默认接走标准输出。箭头表示数据流向。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="45" y="107" width="200" height="145" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="145" y="179" font-size="21" fill="#163d43" text-anchor="middle" font-weight="600">正在运行的工具</text><path d="M257 136 L517 82" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M257 224 L517 271" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="28" width="225" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="564" y="56" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">正常结果</text><text x="564" y="81" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">output.txt</text><rect x="550" y="217" width="225" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="564" y="245" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">诊断信息</text><text x="564" y="270" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">error.txt</text><text x="330" y="75" font-size="20" fill="#28766f" text-anchor="start" font-weight="400">1 · stdout   &gt;</text><text x="323" y="280" font-size="20" fill="#9a5d39" text-anchor="start" font-weight="400">2 · stderr   2&gt;</text></g></svg>