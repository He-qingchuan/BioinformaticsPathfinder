<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">小工具怎样合作</title><desc id="desc">相同名称先排在一起，uniq -c 才能合并相邻行并计数。这是记录条数，不能直接当作鸟的数量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="30" y="80" width="195" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="44" y="108" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">sparrow</text><text x="44" y="133" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">magpie</text><text x="44" y="158" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">sparrow</text><text x="44" y="183" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">…</text><path d="M239 145 L302 145" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="80" width="195" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="334" y="108" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">magpie</text><text x="334" y="133" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">magpie</text><text x="334" y="158" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">sparrow</text><text x="334" y="183" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">…</text><path d="M529 145 L592 145" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="610" y="80" width="195" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="624" y="108" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">2 magpie</text><text x="624" y="133" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">4 sparrow</text><text x="267" y="115" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">sort</text><text x="566" y="115" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">uniq -c</text><text x="425" y="287" font-size="21" fill="#163d43" text-anchor="middle" font-weight="400">每一段都可以单独看，再接成管道。</text><text x="425" y="322" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">这里数的是记录，不是每次看到的鸟数。</text></g></svg>