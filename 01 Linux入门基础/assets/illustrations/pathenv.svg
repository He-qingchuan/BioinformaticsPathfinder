<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">沿 PATH 寻找外部程序</title><desc id="desc">Shell 按搜索顺序查找外部命令；前面的目录可能遮住后面的同名程序。示意不包含别名、函数和内建命令等其他处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="40" y="60" font-size="23" fill="#163d43" text-anchor="start" font-weight="600">输入一个外部命令名 → 按目录顺序查找</text><path d="M35 127v-8q0-9 9-9h90.0l13 16h101.25q12 0 12 12v62q0 12-12 12H47q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="50" y="172" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">~/bin</text><text x="145" y="255" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">个人工具</text><path d="M273 157 L309 157" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M317 127v-8q0-9 9-9h90.0l13 16h101.25q12 0 12 12v62q0 12-12 12H329q-12 0-12-12Z" fill="#dcebdc" stroke="#76998e" stroke-width="2"/><text x="332" y="172" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">/usr/local/bin</text><text x="427" y="255" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">本机安装</text><path d="M555 157 L591 157" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M599 127v-8q0-9 9-9h90.0l13 16h101.25q12 0 12 12v62q0 12-12 12H611q-12 0-12-12Z" fill="#dceef0" stroke="#76998e" stroke-width="2"/><text x="614" y="172" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">/usr/bin</text><text x="709" y="255" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">系统工具</text><text x="425" y="323" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">command -v 名称：先看当前环境会找到什么。</text></g></svg>