<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">从窗口到系统</title><desc id="desc">终端展示文字，Shell 解释命令，工具通过系统使用资源。箭头表示这次操作的层次，不是完整操作系统结构。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="35" y="70" width="250" height="132" rx="12" fill="#163d43" stroke="#163d43" stroke-width="2"/><circle cx="55" cy="90" r="4" fill="#e7b97b"/><circle cx="73" cy="90" r="4" fill="#86a98a"/><circle cx="91" cy="90" r="4" fill="#86b4ba"/><text x="53" y="124" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">$ ls notes</text><text x="53" y="154" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">morning.txt</text><text x="53" y="184" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">evening.txt</text><path d="M300 145 L350 145" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="70" width="170" height="160" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="450" y="135" font-size="30" fill="#163d43" text-anchor="middle" font-weight="700">Bash</text><text x="450" y="177" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">解释这条命令</text><path d="M548 145 L597 145" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="612" y="70" width="215" height="160" rx="14" fill="#dceef0" stroke="#a5c2bd" stroke-width="2"/><text x="720" y="128" font-size="26" fill="#163d43" text-anchor="middle" font-weight="600">工具与内核</text><text x="720" y="174" font-size="18" fill="#163d43" text-anchor="middle" font-weight="400">读取目录信息</text><text x="162" y="285" font-size="20" fill="#163d43" text-anchor="middle" font-weight="400">终端：看见与输入</text><text x="450" y="285" font-size="20" fill="#163d43" text-anchor="middle" font-weight="400">Shell：解释与组织</text><text x="720" y="285" font-size="20" fill="#163d43" text-anchor="middle" font-weight="400">系统：使用资源</text></g></svg>