<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">把一条命令拆开看</title><desc id="desc">命令名告诉 Shell 做什么；选项改变行为；路径等参数指定操作对象。空格分隔各项，引号可以保护一项内部的空格。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="75" y="50" width="700" height="72" rx="12" fill="#163d43" stroke="#163d43" stroke-width="2"/><circle cx="95" cy="70" r="4" fill="#e7b97b"/><circle cx="113" cy="70" r="4" fill="#86a98a"/><circle cx="131" cy="70" r="4" fill="#86b4ba"/><text x="93" y="104" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">$ ls -l notes</text><rect x="120" y="190" width="150" height="90" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="195" y="229" font-size="26" fill="#163d43" text-anchor="middle" font-weight="700">ls</text><text x="195" y="259" font-size="16" fill="#163d43" text-anchor="middle" font-weight="400">命令名称</text><rect x="350" y="190" width="150" height="90" rx="14" fill="#f5e6c9" stroke="#a5c2bd" stroke-width="2"/><text x="425" y="229" font-size="26" fill="#163d43" text-anchor="middle" font-weight="700">-l</text><text x="425" y="259" font-size="16" fill="#163d43" text-anchor="middle" font-weight="400">详细列表选项</text><rect x="610" y="190" width="150" height="90" rx="14" fill="#dceef0" stroke="#a5c2bd" stroke-width="2"/><text x="685" y="229" font-size="26" fill="#163d43" text-anchor="middle" font-weight="700">notes</text><text x="685" y="259" font-size="16" fill="#163d43" text-anchor="middle" font-weight="400">目标目录参数</text><text x="425" y="325" font-size="19" fill="#163d43" text-anchor="middle" font-weight="400">只输入命令；$ 是示意提示符。</text></g></svg>