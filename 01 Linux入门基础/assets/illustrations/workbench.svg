<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" role="img" aria-labelledby="title desc"><title id="title">从观察站的文件柜走进 Linux</title><desc id="desc">笔记、日志与表格放入不同目录，终端用文字操作同一批文件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><path d="M0 320Q170 140 330 300T850 200V570H0Z" fill="#dcebdc"/><path d="M0 370Q280 275 460 355T850 300V570H0Z" fill="#c4ded3"/><rect x="45" y="60" width="370" height="445" rx="18" fill="#fff" stroke="#a5c2bd" stroke-width="2"/><text x="76" y="101" font-size="24" fill="#163d43" text-anchor="start" font-weight="600">观察站 · 文件柜</text><path d="M79 158v-8q0-9 9-9h111.2l13 16h125.10000000000001q12 0 12 12v62q0 12-12 12H91q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="94" y="203" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">notes / 观察笔记</text><path d="M79 271v-8q0-9 9-9h111.2l13 16h125.10000000000001q12 0 12 12v62q0 12-12 12H91q-12 0-12-12Z" fill="#dceef0" stroke="#76998e" stroke-width="2"/><text x="94" y="316" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">logs / 设备日志</text><path d="M79 384v-8q0-9 9-9h111.2l13 16h125.10000000000001q12 0 12 12v62q0 12-12 12H91q-12 0-12-12Z" fill="#dcebdc" stroke="#76998e" stroke-width="2"/><text x="94" y="429" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">tables / 小小数据表</text><rect x="445" y="160" width="375" height="192" rx="12" fill="#163d43" stroke="#163d43" stroke-width="2"/><circle cx="465" cy="180" r="4" fill="#e7b97b"/><circle cx="483" cy="180" r="4" fill="#86a98a"/><circle cx="501" cy="180" r="4" fill="#86b4ba"/><text x="463" y="214" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">$ pwd</text><text x="463" y="244" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">/home/river/linux-lab</text><text x="463" y="274" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">$ ls</text><text x="463" y="304" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">notes  logs  tables</text><text x="463" y="334" font-size="17" fill="#f3f8f3" text-anchor="start" font-weight="400">$ _</text><rect x="424" y="417" width="410" height="20" rx="5" fill="#b98f61" stroke="#ad8051" stroke-width="2"/><path d="M455 438v68m348-68v68" stroke="#ad8051" stroke-width="14"/><path d="M546 102q14-18 28 0q14-18 28 0M659 69q12-15 24 0q12-15 24 0" fill="none" stroke="#537d74" stroke-width="3"/><text x="630" y="480" font-size="21" fill="#163d43" text-anchor="middle" font-weight="400">一个文件，一条线索。</text></g></svg>