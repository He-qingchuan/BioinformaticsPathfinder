<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">同一个程序，可以有不同的运行实例</title><desc id="desc">程序文件好比保存的步骤，进程是正在运行的一次。PID 用于识别进程，图中的编号仅为示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><rect x="30" y="113" width="180" height="120" rx="5" fill="#ffffff" stroke="#a5c2bd" stroke-width="2"/><text x="44" y="141" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">程序文件</text><text x="44" y="166" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">sleep</text><path d="M226 154 L356 87" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M226 187 L356 267" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="32" width="398" height="114" rx="14" fill="#dcebdc" stroke="#a5c2bd" stroke-width="2"/><text x="408" y="74" font-size="24" fill="#163d43" text-anchor="start" font-weight="600">一次运行 · PID 1201</text><text x="408" y="116" font-size="20" fill="#163d43" text-anchor="start" font-weight="400">等待 5 秒 → 正常结束</text><rect x="380" y="215" width="398" height="114" rx="14" fill="#dceef0" stroke="#a5c2bd" stroke-width="2"/><text x="408" y="257" font-size="24" fill="#163d43" text-anchor="start" font-weight="600">另一次运行 · PID 1202</text><text x="408" y="299" font-size="20" fill="#163d43" text-anchor="start" font-weight="400">等待 15 秒 → 正常结束</text></g></svg>