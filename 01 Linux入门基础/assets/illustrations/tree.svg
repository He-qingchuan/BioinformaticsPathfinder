<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">一棵目录树，一枚位置图钉</title><desc id="desc">linux-lab 是练习根目录。notes、logs、tables、tools 和 results 都在它下面；箭头标出从 notes 经父目录进入 tables 的路线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#28766f" stroke-width="1.5"/></marker></defs><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><path d="M333 37v-8q0-9 9-9h70.0l13 16h78.75q12 0 12 12v62q0 12-12 12H345q-12 0-12-12Z" fill="#dcebdc" stroke="#76998e" stroke-width="2"/><text x="348" y="82" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">linux-lab</text><path d="M425 125 L120 178" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M35 207v-8q0-9 9-9h64.0l13 16h72.0q12 0 12 12v62q0 12-12 12H47q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="50" y="252" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">notes</text><path d="M425 125 L385 178" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 207v-8q0-9 9-9h64.0l13 16h72.0q12 0 12 12v62q0 12-12 12H312q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="315" y="252" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">logs</text><path d="M425 125 L655 178" fill="none" stroke="#28766f" stroke-width="3" marker-end="url(#arrow)"/><path d="M570 207v-8q0-9 9-9h64.0l13 16h72.0q12 0 12 12v62q0 12-12 12H582q-12 0-12-12Z" fill="#f5e6c9" stroke="#76998e" stroke-width="2"/><text x="585" y="252" font-size="18" fill="#163d43" text-anchor="start" font-weight="600">tables</text><text x="117" y="335" font-size="17" fill="#163d43" text-anchor="middle" font-weight="400">morning.txt</text><text x="390" y="335" font-size="17" fill="#163d43" text-anchor="middle" font-weight="400">day-01.log</text><text x="657" y="335" font-size="17" fill="#163d43" text-anchor="middle" font-weight="400">observations.tsv</text><text x="730" y="57" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">同级目录还有</text><text x="730" y="83" font-size="15" fill="#163d43" text-anchor="start" font-weight="400">tools / results</text><path d="M155 188Q255 105 360 110M490 110Q620 115 656 179" fill="none" stroke="#ad7143" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="193" y="144" font-size="16" fill="#8b552f" text-anchor="start" font-weight="400">.. 返回父目录</text><text x="574" y="144" font-size="16" fill="#8b552f" text-anchor="start" font-weight="400">进入 tables</text></g></svg>