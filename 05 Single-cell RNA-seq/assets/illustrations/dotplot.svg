<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" role="img" aria-label="同一个圆点，携带两种信息"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#557e65"/></marker></defs><rect width="850" height="420" rx="18" fill="#f5f8ee"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="24" y="34" font-size="23" fill="#233f46" text-anchor="start">同一个圆点，携带两种信息</text><circle cx="95" cy="170" r="10" fill="#c87553" stroke="#547b70"/><circle cx="209" cy="170" r="21" fill="#c87553" stroke="#547b70"/><circle cx="325" cy="170" r="34" fill="#c87553" stroke="#547b70"/><text x="58" y="257" font-size="19" fill="#233f46" text-anchor="start">小 → 大：检出比例增加</text><circle cx="513" cy="170" r="27" fill="#f3d8c9" stroke="#547b70"/><circle cx="633" cy="170" r="27" fill="#d18d79" stroke="#547b70"/><circle cx="754" cy="170" r="27" fill="#974d54" stroke="#547b70"/><text x="467" y="257" font-size="19" fill="#233f46" text-anchor="start">浅 → 深：均值显示值增加</text><text x="138" y="320" font-size="20" fill="#233f46" text-anchor="start">大而浅 ≠ 小而深；缩放色条 ≠ 原始表达量</text><text x="24" y="404" font-size="13" fill="#547078" text-anchor="start">原理示意 · 数量、距离和颜色不代表本案例实际测量</text></g></svg>